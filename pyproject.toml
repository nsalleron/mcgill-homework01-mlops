[project]
name = "mcgill-homework01-mlops"
version = "0.1.0"
description = "Fashion-MNIST MLOps pipeline: train, track, store, serve"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.34.0",
    "mlflow>=2.12.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "toml>=0.10.2",
    "scikit-learn>=1.4.0",
]

[project.scripts]
train = "src.train.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
